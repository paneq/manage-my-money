spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ror_modernization
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    org.springframework: INFO
    com.modernization: DEBUG

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 hours